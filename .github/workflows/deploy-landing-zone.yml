name: Deploy Azure Landing Zone

on:
  push:
    branches: [ main ]
    paths:
      - 'main.bicep'
      - 'modules/**'
      - 'parameters.json'
  workflow_dispatch:
    # Manual trigger allowed

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Landing Zone
        run: |
          az deployment sub create \
            --name "LandingZone-${{ github.run_id }}" \
            --location "${{ secrets.LOCATION || 'eastus' }}" \
            --template-file main.bicep \
            --parameters \
                projectName="${{ secrets.PROJECT_NAME || 'my-lz' }}" \
                location="${{ secrets.LOCATION || 'eastus' }}" \
                environment="${{ secrets.ENVIRONMENT || 'production' }}" \
                hubVnetAddressSpace="${{ secrets.HUB_VNET_ADDRESS_SPACE || '10.100.0.0/16' }}" \
                spokeVnetAddressSpace="${{ secrets.SPOKE_VNET_ADDRESS_SPACE || '10.200.0.0/16' }}" \
                firewallPrivateIp="${{ secrets.FIREWALL_PRIVATE_IP || '10.100.0.4' }}" \
                alertEmailAddress="${{ secrets.ALERT_EMAIL_ADDRESS }}" \
                keyVaultAccessObjectId="${{ secrets.KEYVAULT_ACCESS_OBJECT_ID }}"